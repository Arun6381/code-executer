version: '3.9'

services:
  code-runner:
    build: .
    container_name: edxzone-code-runner
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ALLOWED_ORIGIN=https://edxzone.in
    restart: unless-stopped
    mem_limit: 512m
    cpus: '1.0'
    # No Docker socket needed anymore!
